# Spring Boot configuration
spring.application.name=pf4j-spring-demo-app
spring.main.banner-mode=console

# PF4J configuration
pf4j.plugins-dir=plugins

# Logging configuration
logging.level.root=INFO
logging.level.org.pf4j=DEBUG
logging.level.org.pf4j.PluginClassLoader=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
